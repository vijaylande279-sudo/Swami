# Local dev environment for swami-suite Phase 0 (PLATFORM_BUILD_INSTRUCTIONS.md §11
# gate: `docker compose up` gives a working local platform).
#
# Does NOT include the existing backend/ or frontend/ (the live restaurant app) —
# those keep deploying independently to Railway and are untouched by this file.
#
# Build context is the repo root so each service Dockerfile can COPY platform/pom.xml
# and platform/common/* alongside its own module.
name: swami-suite

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swami
      POSTGRES_PASSWORD: swami
      POSTGRES_DB: swami_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Postgres only runs /docker-entrypoint-initdb.d/ scripts against an empty data
      # volume (first-ever startup). If this volume already exists from before Phase 1,
      # `docker compose down -v` then `up` again to pick up db_identity/db_tenant.
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swami -d swami_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Official Apache Kafka image (KRaft mode, no zookeeper needed). Not bitnami/* -
    # Bitnami stopped publishing pinned version tags like 3.7 on the free Docker Hub
    # tier, so bitnami/kafka:3.7 no longer resolves.
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swami
      MINIO_ROOT_PASSWORD: swami12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  discovery-server:
    build:
      context: ..
      dockerfile: platform/platform-services/discovery-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: ..
      dockerfile: platform/platform-services/config-server/Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: platform/platform-services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SWAMISUITE_JWT_JWKSCLIENT_URL: http://identity-service:8081/.well-known/jwks.json
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_started

  identity-service:
    build:
      context: ..
      dockerfile: platform/platform-services/identity-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_identity
      SPRING_DATASOURCE_USERNAME: swami
      SPRING_DATASOURCE_PASSWORD: swami
      SWAMISUITE_JWT_KEYS_PRIVATEKEYPATH: /keys/private.pem
      SWAMISUITE_JWT_KEYS_PUBLICKEYPATH: /keys/public.pem
      SWAMISUITE_SERVICES_TENANTSERVICEURL: http://tenant-service:8082
      SWAMISUITE_SERVICES_INTERNALTOKEN: dev-internal-token-change-me
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - identity-keys:/keys
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy

  tenant-service:
    build:
      context: ..
      dockerfile: platform/platform-services/tenant-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_tenant
      SPRING_DATASOURCE_USERNAME: swami
      SPRING_DATASOURCE_PASSWORD: swami
      SWAMISUITE_JWT_JWKSCLIENT_URL: http://identity-service:8081/.well-known/jwks.json
      SWAMISUITE_SERVICES_IDENTITYSERVICEURL: http://identity-service:8081
      SWAMISUITE_SERVICES_INTERNALTOKEN: dev-internal-token-change-me
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started

  hello-service:
    build:
      context: ..
      dockerfile: platform/platform-services/hello-service/Dockerfile
    ports:
      - "8091:8091"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  identity-keys:
