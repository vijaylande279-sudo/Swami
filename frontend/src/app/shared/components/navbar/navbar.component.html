@if (auth.isLoggedIn() && !isKitchenPage()) {
  <nav
    class="sticky top-0 z-40 w-full"
    style="background: #0f0f0f; border-bottom: 1px solid #2a2a2a; box-shadow: 0 2px 20px rgba(0,0,0,0.3); height: 64px;"
  >
    <div class="h-full flex items-center justify-between px-4">
      <!-- Left — brand -->
      <div class="flex items-center gap-3">
        <div
          class="flex items-center justify-center flex-shrink-0"
          style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #f97316, #ef4444);"
        >
          <span class="text-lg">🏨</span>
        </div>
        <div class="leading-tight">
          <p class="text-white" style="font-weight: 900; letter-spacing: 1.5px; font-size: 17px;">SWAMI PURE VEG</p>
          <p class="text-white" style="opacity: 0.4; font-size: 9px; letter-spacing: 2px;">ORDER MANAGEMENT</p>
        </div>
      </div>

      <!-- Right — user -->
      <div class="flex items-center gap-3">
        <div class="relative flex-shrink-0">
          <div
            class="flex items-center justify-center text-white font-bold"
            style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ef4444); border: 2px solid rgba(255,255,255,0.2); font-size: 13px;"
          >
            {{ (auth.user()?.name ?? '?').charAt(0).toUpperCase() }}
          </div>
          <span
            class="absolute bottom-0 right-0 rounded-full"
            style="width: 8px; height: 8px; border: 2px solid #0f0f0f;"
            [style.background]="socket.connected() ? '#22c55e' : '#6b7280'"
            [attr.aria-label]="socket.connected() ? 'Connected' : 'Connecting'"
            role="status"
          ></span>
        </div>

        <div class="hidden sm:block text-right">
          <p class="text-white" style="font-size: 13px; font-weight: 600;">{{ auth.user()?.name }}</p>
          <p class="text-white" style="opacity: 0.4; font-size: 10px;">{{ auth.user()?.role }}</p>
        </div>

        <span class="hidden sm:block" style="width: 1px; height: 28px; background: rgba(255,255,255,0.12);"></span>

        <button
          type="button"
          class="flex items-center justify-center text-white transition-colors hover:bg-[rgba(239,68,68,0.15)] hover:text-[#ef4444]"
          style="width: 32px; height: 32px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.12);"
          (click)="logout()"
          aria-label="Logout"
        >
          <mat-icon class="!text-lg">logout</mat-icon>
        </button>
      </div>
    </div>
  </nav>
}
