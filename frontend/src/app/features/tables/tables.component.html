<div class="min-h-screen bg-surface pb-8">
  <header class="sticky top-0 z-10 bg-surface-card border-b border-surface-border px-4 py-3">
    <h1 class="text-xl md:text-2xl font-bold text-white">Tables</h1>
  </header>

  @if (isLoading()) {
    <app-loading-spinner label="Loading tables…" />
  } @else if (tables().length === 0) {
    <p class="text-center text-base text-gray-400 py-12">No tables found</p>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3 p-4">
      @for (table of tables(); track table.id) {
        <app-table-card [table]="table" (tap)="onTableTap($event)" (viewBill)="onViewBill($event)" />
      }
    </div>
  }
</div>
