<div class="min-h-screen bg-platform-50">
  @if (auth.isLoggedIn()) {
    <header class="bg-platform-900 text-white">
      <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-6">
          <span class="font-semibold tracking-wide">Swami Suite</span>
          <nav class="flex gap-4 text-sm text-platform-200">
            <a routerLink="/console" class="hover:text-white">Dashboard</a>
            <a routerLink="/" class="hover:text-white">Catalog</a>
            <a *appHasPermission="'tenant:employee:read'" routerLink="/console/employees" class="hover:text-white">Employees</a>
            <a *appHasPermission="'tenant:role:read'" routerLink="/console/roles" class="hover:text-white">Roles</a>
            <a *appHasPermission="'platform:billing:purchase'" routerLink="/console/billing" class="hover:text-white">Billing</a>
          </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
          @if (tenant.current()) {
            <span class="text-platform-300">{{ tenant.current()?.name }} · {{ tenant.current()?.status }}</span>
          }
          <span>{{ auth.currentUser()?.email }}</span>
          <button (click)="logout()" class="px-3 py-1 rounded bg-platform-700 hover:bg-platform-600">Log out</button>
        </div>
      </div>
    </header>
  }

  <main class="max-w-6xl mx-auto px-6 py-8">
    <router-outlet />
  </main>
</div>
