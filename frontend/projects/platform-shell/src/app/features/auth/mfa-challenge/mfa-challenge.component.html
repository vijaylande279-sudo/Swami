<div class="max-w-sm mx-auto mt-20 bg-white rounded-lg shadow p-8">
  <h1 class="text-xl font-semibold text-platform-900 mb-1">Two-factor code</h1>
  <p class="text-sm text-platform-500 mb-6">Enter the 6-digit code from your authenticator app, or a backup code.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <input
      formControlName="code"
      inputmode="numeric"
      autocomplete="one-time-code"
      class="border border-platform-300 rounded px-3 py-2 text-center text-lg tracking-widest"
    />

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || isSubmitting()"
      class="bg-platform-800 text-white rounded px-3 py-2 disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Verifying…' : 'Verify' }}
    </button>
  </form>
</div>
