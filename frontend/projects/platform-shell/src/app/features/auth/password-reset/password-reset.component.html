<div class="max-w-sm mx-auto mt-20 bg-white rounded-lg shadow p-8">
  @if (!token) {
    <h1 class="text-xl font-semibold text-platform-900 mb-6">Reset your password</h1>
    <form [formGroup]="requestForm" (ngSubmit)="requestReset()" class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm text-platform-700">
        Email
        <input formControlName="email" type="email" class="border border-platform-300 rounded px-3 py-2" />
      </label>
      <button
        type="submit"
        [disabled]="requestForm.invalid || isSubmitting()"
        class="bg-platform-800 text-white rounded px-3 py-2 disabled:opacity-50"
      >
        Send reset link
      </button>
      <a routerLink="/login" class="text-sm text-platform-600 text-center">Back to sign in</a>
    </form>
  } @else {
    <h1 class="text-xl font-semibold text-platform-900 mb-6">Choose a new password</h1>
    <form [formGroup]="confirmForm" (ngSubmit)="confirmReset()" class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm text-platform-700">
        New password
        <input formControlName="newPassword" type="password" class="border border-platform-300 rounded px-3 py-2" />
      </label>
      <button
        type="submit"
        [disabled]="confirmForm.invalid || isSubmitting()"
        class="bg-platform-800 text-white rounded px-3 py-2 disabled:opacity-50"
      >
        Update password
      </button>
    </form>
  }
</div>
