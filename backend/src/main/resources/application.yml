server:
  port: ${PORT:8080}

spring:
  application:
    name: hotel-order-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hotel_oms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5
    locations: classpath:db/migration
  jackson:
    generator:
      write-bigdecimal-as-plain: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

hotel:
  name: ${HOTEL_NAME:Swami Hotel}
  upi:
    id: ${HOTEL_UPI_ID:swamihotel@upi}
  tax:
    percent: ${HOTEL_TAX_PERCENT:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
